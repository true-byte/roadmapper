# Runs `npm test` on each supported Node version that package.json's engines covers.
# A ruleset requires the check 'All tests', which passes only when each Node version passes.
name: Test

on:
  pull_request:
    branches: [main, 'release/**']
  push:
    branches: [main, 'release/**']

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  all:
    name: All tests
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = success
