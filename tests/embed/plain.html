<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Plain page</title>
    <!-- a page with no bundler: the lib as one plain script, with the whole icon set; `npm run build:lib` makes it -->
    <script src="../../dist/lib/roadmapper.js" defer></script>
    <style>
      body { margin: 0; padding: 24px; background: #fff; color: #222; font: 16px/1.5 sans-serif; }
      .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 16px; }
    </style>
  </head>
  <body>
    <label>A note <input id="field"></label>
    <div class="pair">
      <roadmapper-view>
        <script type="application/json">
          {
            "title": "Garden plan",
            "branches": [
              {
                "name": "Beds",
                "items": [
                  { "id": "dig", "name": "Dig", "state": "done", "icon": "shovel" },
                  {
                    "name": "Plant",
                    "split": [
                      { "name": "Greens", "items": [{ "id": "leaves", "name": "Lettuce", "state": "in-progress", "icon": "leaf" }] },
                      { "name": "Roots", "items": [{ "id": "roots", "name": "Carrots", "icon": "carrot" }] }
                    ]
                  },
                  { "id": "harvest", "name": "Harvest", "milestone": true }
                ]
              }
            ]
          }
        </script>
      </roadmapper-view>
      <roadmapper-view>
        <script type="application/json">
          {
            "title": "Kitchen plan",
            "branches": [
              {
                "name": "Cook",
                "items": [
                  { "id": "shop", "name": "Shop", "state": "done" },
                  {
                    "name": "Prepare",
                    "split": [
                      { "name": "Soup", "items": [{ "id": "soup", "name": "Soup", "icon": "bowl" }] },
                      { "name": "Bread", "items": [{ "id": "bread", "name": "Bread" }] }
                    ]
                  },
                  { "id": "eat", "name": "Eat", "icon": "chef-hat" }
                ]
              }
            ]
          }
        </script>
      </roadmapper-view>
    </div>
  </body>
</html>
